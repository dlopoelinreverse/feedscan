services:
  web:
    build:
      context: ./web
      target: development
    ports:
      - "${NEXT_PUBLIC_PORT:-3001}:3000"
    env_file:
      - ./.env
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/prisma:/app/prisma
      - ./web/components.json:/app/components.json
      - ./web/next.config.ts:/app/next.config.ts
      - ./web/tailwind.config.ts:/app/tailwind.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
      - ./web/postcss.config.mjs:/app/postcss.config.mjs
    networks:
      - feedscan-network

networks:
  feedscan-network:
    driver: bridge
